version: 0.2
# CodeBuild: build the images from the uploaded source bundle and push them to ECR.
#   $IMAGE_TAG   app image (AgentCore runtimes + API Lambda)
#   $INGEST_TAG  policy ingest Lambda (Docling); skipped when empty or "none"
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build --provenance=false -f infra/Dockerfile -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
      - if [ -n "$INGEST_TAG" ] && [ "$INGEST_TAG" != none ]; then docker build --provenance=false -f infra/Dockerfile.ingest -t $ECR_REGISTRY/$ECR_REPO:$INGEST_TAG .; fi
  post_build:
    commands:
      - docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
      - if [ -n "$INGEST_TAG" ] && [ "$INGEST_TAG" != none ]; then docker push $ECR_REGISTRY/$ECR_REPO:$INGEST_TAG; fi
