version: 0.2
# CodeBuild: build the Lambda image from the uploaded source bundle and push it to ECR. Lambda is the only consumer.
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build --provenance=false -f infra/Dockerfile -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
