[project]
name = "medishield"
version = "0.1.0"
description = "MediShield: multi-agent document intake (classify, extract, KYC, policy RAG, fraud, decide)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "fpdf2>=2.8",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
    "anthropic>=1.11.0",
    "langgraph>=1.2.12",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "rapidfuzz>=3.14.6",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.4",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "huey>=3.4.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "reportlab>=5.0.1",
    "python-multipart>=0.0.32",
    "boto3>=1.43.108",
    "redis>=8.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "uharfbuzz>=0.56.2",
    "fonttools>=4.66.1",
    "mangum>=0.22.0",
    "pypdfium2>=5.14.0",
    "bedrock-agentcore>=1.24.0",
    "mcp>=1.20",
]

[dependency-groups]
# Docling (PDF policy parsing, pulls PyTorch) is only needed to ingest a new policy; the Lambda image leaves it out
ingest = ["docling>=2.133.0"]
dev = [
    "botocore[crt]>=1.43.108",
    "moto>=5.2.3",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.uv.build-backend]
module-root = "backend/src"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "eval/tests"]
pythonpath = ["backend/tests"]
markers = ["integration: runs the real pipeline against cached model responses (needs data/official)"]

[tool.ruff]
# the instructors' generator scripts are vendored byte-for-byte unmodified; never lint-fix them
extend-exclude = ["datagen/official"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# DTZ: document dates (DOB, expiry, service date) are calendar dates without a timezone by nature.
# UP046/UP047: the codebase keeps classic TypeVar generics for readability.
extend-ignore = ["DTZ007", "DTZ005", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# the data harness deliberately executes the vendored generator scripts and survives font failures
"datagen/*.py" = ["S102", "BLE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["medishield.api.security.require", "fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header"]
